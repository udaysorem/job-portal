<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot Password</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="logo">JobPortal</a>
      <button id="menu-btn" class="menu-btn" aria-label="Toggle menu" aria-expanded="false">&#9776;</button>
      <nav id="nav-links" class="nav-links">
        <a href="index.html">Home</a>
        <a href="signin.html">Sign In</a>
        <a href="signup.html" class="nav-signup">Sign Up</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="form-box">
      <h1>Forgot Password</h1>
      <p class="gray">Enter your email and we will send you a reset link.</p>
      <div id="success" class="alert alert-success hidden">Check your email for the reset link.</div>
      <form id="forgot-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" aria-describedby="email-error">
        <p id="email-error" class="error-text"></p>
      </div>
      <button id="submit-btn" type="submit" class="btn">Send Reset Link</button>
      </form>
      <p class="links"><a href="signin.html">Back to sign in</a></p>
    </div>
  </main>

  <footer class="footer">
    <p>&copy; 2026 JobPortal. Internship project.</p>
  </footer>

  <script src="js/navbar.js"></script>
  <script src="js/helpers.js"></script>
  <script src="js/forgot.js"></script>
</body>
</html>
