<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mark Attendance</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="logo">JobPortal</a>
      <button id="menu-btn" class="menu-btn" aria-label="Toggle menu" aria-expanded="false">&#9776;</button>
      <nav id="nav-links" class="nav-links"></nav>
    </div>
  </header>

  <main>
    <div class="container section">
      <h1>Mark Attendance</h1>
      <p class="gray">Attendance is tracked for job seekers only.</p>
      <div id="success" class="alert alert-success hidden">Attendance saved!</div>
      <div class="toolbar">
        <div class="field">
          <label for="date">Date</label>
          <input id="date" type="date" aria-describedby="date-error">
          <p id="date-error" class="error-text"></p>
        </div>
        <button id="all-present" type="button" class="btn btn-gray">Mark all present</button>
        <button id="save-btn" type="button" class="btn">Save Attendance</button>
      </div>
      <div class="table-wrap">
        <table class="table">
          <thead><tr><th>Name</th><th>Email</th><th>Attendance</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>&copy; 2026 JobPortal. Internship project.</p>
  </footer>

  <script src="js/auth.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/helpers.js"></script>
  <script src="js/attendance.js"></script>
</body>
</html>
