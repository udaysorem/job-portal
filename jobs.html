<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find Jobs</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="logo">JobPortal</a>
      <button id="menu-btn" class="menu-btn" aria-label="Toggle menu" aria-expanded="false">&#9776;</button>
      <nav id="nav-links" class="nav-links"></nav>
    </div>
  </header>

  <main>
    <div class="container section">
      <h1>Find Jobs</h1>
      <div class="toolbar">
        <input id="search" class="filter-input" type="text" placeholder="Search title, company, location" aria-label="Search jobs">
        <select id="type" class="filter-input" aria-label="Filter by type">
          <option value="all">All types</option>
          <option value="Internship">Internship</option>
          <option value="Full-time">Full-time</option>
          <option value="Part-time">Part-time</option>
        </select>
        <select id="sort" class="filter-input" aria-label="Sort jobs">
          <option value="newest">Newest first</option>
          <option value="title">Title A-Z</option>
          <option value="company">Company A-Z</option>
        </select>
        <button id="view-btn" type="button" class="btn btn-gray">Table view</button>
      </div>
      <p id="result-count" class="gray"></p>
      <div id="job-area"></div>
    </div>
  </main>

  <footer class="footer">
    <p>&copy; 2026 JobPortal. Internship project.</p>
  </footer>

  <script src="js/auth.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/jobs.js"></script>
  <script src="js/service.js"></script>
  <script src="js/components.js"></script>
  <script src="js/job-list.js"></script>
</body>
</html>
