<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="logo">JobPortal</a>
      <button id="menu-btn" class="menu-btn" aria-label="Toggle menu" aria-expanded="false">&#9776;</button>
      <nav id="nav-links" class="nav-links">
        <a href="index.html">Home</a>
        <a href="signin.html">Sign In</a>
        <a href="signup.html" class="nav-signup">Sign Up</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="form-box">
      <h1>Sign In</h1>
      <div id="success" class="alert alert-success hidden">Signed in successfully!</div>
      <form id="signin-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" aria-describedby="email-error">
        <p id="email-error" class="error-text"></p>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" aria-describedby="password-error">
        <p id="password-error" class="error-text"></p>
      </div>
      <button id="submit-btn" type="submit" class="btn">Sign In</button>
      </form>
      <p class="links"><a href="forgot-password.html">Forgot password?</a></p>
      <p class="links">New here? <a href="signup.html">Create an account</a></p>
    </div>
  </main>

  <footer class="footer">
    <p>&copy; 2026 JobPortal. Internship project.</p>
  </footer>

  <script src="js/navbar.js"></script>
  <script src="js/helpers.js"></script>
  <script src="js/signin.js"></script>
</body>
</html>
